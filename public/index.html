<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12151c" media="(prefers-color-scheme: dark)">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="StepSpeak">
  <title>StepSpeak English</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 合言葉 -->
  <main id="login" class="screen" hidden>
    <header class="hero">
      <h1>StepSpeak <span>English</span></h1>
      <p>合言葉を入力してください。</p>
    </header>
    <form id="login-form" class="login-form">
      <input id="login-input" type="password" autocomplete="current-password" aria-label="合言葉" required>
      <button class="primary" type="submit">はじめる</button>
      <p id="login-error" class="status error"></p>
    </form>
  </main>

  <!-- ホーム -->
  <main id="home" class="screen" hidden>
    <header class="hero">
      <h1>StepSpeak <span>English</span></h1>
      <p>読むのではなく、声に出して会話しながら上達しよう。</p>
      <p id="stats" class="stats" hidden></p>
    </header>

    <section>
      <h2>レベル</h2>
      <div id="levels" class="levels" role="radiogroup" aria-label="レベル"></div>
      <p class="tip">迷ったら Step 2 から。高校で英語を習った人は Step 2〜3 が目安です。</p>
    </section>

    <section id="practice-entry" hidden></section>

    <section>
      <h2>シーンを選んで会話スタート <span id="level-progress"></span></h2>
      <div id="scenarios" class="scenarios"></div>
    </section>

    <p id="support-note" class="note" hidden></p>
  </main>

  <!-- 会話 -->
  <main id="talk" class="screen" hidden>
    <header class="bar">
      <button id="end" class="ghost" type="button">終了してふりかえり</button>
      <div id="talk-title" class="bar-title"></div>
      <button id="settings-toggle" class="ghost" type="button" aria-expanded="false" aria-controls="settings">設定</button>
    </header>

    <div id="settings" class="settings" hidden>
      <label><input type="checkbox" id="opt-text"> 相手の英文を最初から表示する</label>
      <label><input type="checkbox" id="opt-hands"> ハンズフリー(相手が話し終えたら自動で聞き取り)</label>
      <label>話す速さ
        <select id="opt-rate">
          <option value="0.7">ゆっくり</option>
          <option value="0.85">ややゆっくり</option>
          <option value="1">ふつう</option>
          <option value="1.15">速め</option>
        </select>
      </label>
    </div>

    <ul id="goals" class="goals" aria-label="このシーンのミッション"></ul>

    <div id="log" class="log" aria-live="polite"></div>

    <footer class="dock">
      <div id="hints" class="hints" hidden></div>
      <p id="status" class="status"></p>
      <div id="countdown" class="countdown" hidden><span></span></div>
      <div class="controls">
        <button id="hint-btn" class="side" type="button" disabled>💡<span>ヒント</span></button>
        <button id="redo-btn" class="side" type="button" hidden>🔁<span>言い直す</span></button>
        <button id="mic" class="mic" type="button" disabled aria-label="話す">
          <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path class="i-mic" fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-6a3.5 3.5 0 0 0-7 0v6A3.5 3.5 0 0 0 12 15Zm6-3.5a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.91V20H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.59a6 6 0 0 0 5-5.91Z"/><path class="i-send" fill="currentColor" d="M9.5 16.2 5.3 12l-1.4 1.4 5.6 5.6 11-11-1.4-1.4z"/></svg>
        </button>
        <button id="more-btn" class="side" type="button" hidden>➕<span>続きを話す</span></button>
        <button id="ja-btn" class="side" type="button" disabled>🇯🇵<span>日本語で言う</span></button>
      </div>
      <form id="type-form" class="type-form">
        <input id="type-input" type="text" autocomplete="off" placeholder="声が使えないときは英語で入力" aria-label="英語で入力">
        <button type="submit">送信</button>
      </form>
    </footer>
  </main>

  <!-- 復習 -->
  <main id="practice" class="screen" hidden>
    <header class="bar plain">
      <button id="practice-end" class="ghost" type="button">おわる</button>
      <div id="practice-title" class="bar-title">復習</div>
      <span></span>
    </header>
    <div id="practice-body"></div>
  </main>

  <!-- ふりかえり -->
  <main id="review" class="screen" hidden>
    <header class="hero">
      <h1>ふりかえり</h1>
    </header>
    <div id="review-body"></div>
    <button id="review-home" class="primary" type="button">ホームに戻る</button>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
